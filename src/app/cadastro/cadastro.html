<h3>Cadastro</h3>
<div class="alert alert-success" ngIf="mensagem.length>0">{{mensagem}}</div>
<form class="was-validated">
    <label for="txtNome" class="form-label">nome:</label>
    <input type="text" class="form-control" id="txtNome" name="txtNome" [(ngModel)]="obj.nome" required>
    <div class="invalid-feedback">Nome completo e obrigatório!</div>

    <label class="form-label" for="txtEmail">email:</label>
    <input type="email" class="form-control" name="txtNome" [(ngModel)]="obj.email" required>
    <div class="invalid-feedback">E-mail e obrigatório!</div>

    <label class="form-label">senha:</label>
    <input type="password" class="form-control" id="txtSenha" name="txtSenha" [(ngModel)]="obj.senha" required>
    <div class="invalid-feedback">A senha deve conter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma minúscula, um número e um caractere especial.</div>

    <label class="form-label">documento:</label>
    <input type="text" class="form-control" id="txtDocumento" name="txtDocumento" [(ngModel)]="obj.documento"required><br>
    <div class="invalid-feedback">Documento e obrigatório!</div>

    <label class="form-label" for="txtTelefone">telefone:</label>
    <input type="text" class="form-control" id="txtTelefone" name="txtTelefone" [(ngModel)]="obj.telefone" required>
    <div class="invalid-feedback">Telefone e obrigatório!</div>

    <label class="form-label" for="txtEndereco">endereço:</label>
    <textarea class="form-control" id="txtEndereco" rows="5" name="txtEndereco" [(ngModel)]="obj.logradouro" required></textarea>
    <div class="invalid-feedback">Informe o seu endereço completo!</div><br>
    <button class="btn btn-success w-100">Gravar</button>
</form>
