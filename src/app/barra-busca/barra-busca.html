<div class="row">
  <div class="col">
    <input
      type="text"
      name="txtBusca"
      placeholder="busca"
      class="form-control"
      [(ngModel)]="textoBusca"
      (ngModelChange)="salvarBusca()"
    >
  </div>

  <div class="col">
    <button
      class="btn btn-warning"
      (click)="salvarBusca()"
    >
      ok
    </button>
  </div>
</div>
